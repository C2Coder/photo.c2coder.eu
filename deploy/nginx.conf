# photo-admin.c2cdn.eu - Flask admin behind Cloudflare (proxied + Access).
# Installed to /etc/nginx/sites-available/photo-admin.c2cdn.eu by deploy/deploy.sh.
# Zips go from the browser straight to R2, so only single images pass through here.

server {
    listen 80;
    listen [::]:80;
    server_name photo-admin.c2cdn.eu;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://photo-admin.c2cdn.eu$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name photo-admin.c2cdn.eu;

    ssl_certificate     /etc/letsencrypt/live/photo-admin.c2cdn.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo-admin.c2cdn.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/photo-admin.access.log;
    error_log  /var/log/nginx/photo-admin.error.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:8327;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
